name: 每日赛程赔率自动更新

on:
  schedule:
    - cron: '15 3 * * *'   # 北京时间 11:15 早间更新（赔率+早期赛果）
    - cron: '0 7 * * *'    # 北京时间 15:00 午间更新
    - cron: '15 12 * * *'  # 北京时间 20:15 晚间补抓（补全日间晚场赛果）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取赔率并更新
        run: python update_odds_net.py --no-push
        env:
          PYTHONIOENCODING: utf-8

      # === 赛果抓取：失败则retry，重试耗尽后真正阻断CI（禁止静默吞错）===
      # 历史问题：2026-08-16工作流赛果步骤失败，被 set+e + continue-on-error 双保险吞掉，
      # 导致 8-15 的 30 场赛果"API有数据但线上永远为空"。
      - name: 抓取赛果（失败阻断+自动重试）
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_wait_seconds: 30
          shell: bash
          command: |
            set -euo pipefail
            echo "== 第${RETRY_ATTEMPT_NUMBER:-1}次尝试抓取赛果 =="
            python update_odds_net.py --no-push --results-only
        env:
          PYTHONIOENCODING: utf-8

      - name: 强制校验赛果完整性（前一天必须至少1条，否则阻断CI）
        run: |
          set -euo pipefail
          python3 -c "
          import json, sys
          from datetime import date, timedelta
          with open('results_data.json', 'r', encoding='utf-8') as f:
              results = json.load(f)
          today = date.today().strftime('%Y-%m-%d')
          yesterday = (date.today() - timedelta(days=1)).strftime('%Y-%m-%d')
          today_count = sum(1 for k in results if k.startswith(today))
          yest_count = sum(1 for k in results if k.startswith(yesterday))
          total = len(results)
          print(f'赛果总计: {total} 条')
          print(f'昨日({yesterday}): {yest_count} 条, 今日({today}): {today_count} 条')
          if total == 0:
              print('❌ 赛果数据完全为空，CI阻断')
              sys.exit(1)
          # 关键校验：过了 UTC+8 12点(=UTC 04点)后，前一天赛果必须≥1条
          from datetime import datetime
          h = datetime.utcnow().hour
          require_yesterday = (h >= 4)
          if require_yesterday and yest_count == 0:
              print(f'❌ 已过12点(北京时间)，{yesterday}赛果仍为0条。赛果同步链路异常，CI阻断')
              sys.exit(1)
          print('✅ 赛果数据校验通过')
          "

      - name: 生成版本号
        run: date '+%Y%m%d%H%M%S' > version.txt

      - name: 验证数据完整性（league 字段）
        run: |
          python3 -c "
          import json, sys
          with open('odds_data.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          games = data.get('data', {})
          if not games:
              print('⚠️ 无比赛数据，跳过验证')
              sys.exit(0)
          empty = sum(1 for g in games.values() if not g.get('league'))
          total = len(games)
          ratio = empty / total
          print(f'联赛字段检查: {empty}/{total} 为空 ({ratio:.0%})')
          if ratio > 0.3:
              print('❌ 超过 30% 的比赛 league 字段为空，终止发布')
              sys.exit(1)
          print('✅ 数据完整性校验通过')
          "

      - name: 检查是否有更新
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 推送更新到 master 和 gh-pages
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # 保存更新文件到临时目录
          cp odds_data.json /tmp/odds_data.json
          cp index.html /tmp/index.html
          cp version.txt /tmp/version.txt
          rm -rf /tmp/odds_history
          cp -r odds_history/ /tmp/odds_history/ 2>/dev/null || true
          cp results_data.json /tmp/results_data.json
          rm -rf /tmp/results_history
          cp -r results_history/ /tmp/results_history/ 2>/dev/null || true

          # 1. 推送到 master
          git add index.html odds_data.json version.txt
          git add odds_history/ 2>/dev/null || true
          git add results_data.json 2>/dev/null || true
          git add results_history/ 2>/dev/null || true
          git diff --cached --stat
          git commit -m "data: 自动更新赛程赔率 $(date '+%Y-%m-%d %H:%M')"
          git pull origin master --rebase
          git push origin master

          # 2. 推送到 gh-pages（保持分支独立，仅同步静态文件）
          git checkout gh-pages
          cp /tmp/odds_data.json odds_data.json
          cp /tmp/index.html index.html
          cp /tmp/version.txt version.txt
          mkdir -p odds_history
          cp -r /tmp/odds_history/* odds_history/ 2>/dev/null || true
          cp /tmp/results_data.json results_data.json
          mkdir -p results_history
          cp -r /tmp/results_history/* results_history/ 2>/dev/null || true
          git add index.html odds_data.json version.txt
          git add odds_history/ 2>/dev/null || true
          git add results_data.json 2>/dev/null || true
          git add results_history/ 2>/dev/null || true
          git diff --cached --stat
          git commit -m "data: 自动更新赛程赔率 $(date '+%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git pull origin gh-pages --rebase
          git push origin gh-pages
