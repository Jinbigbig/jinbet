name: 每日赛程赔率自动更新

on:
  schedule:
    - cron: '15 3 * * *'   # 北京时间 11:15 早间更新（赔率+早期赛果）
    - cron: '0 5 * * *'    # 北京时间 13:00 午间更新
    - cron: '15 12 * * *'  # 北京时间 20:15 晚间补抓（补全日间晚场赛果）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # === 赔率步骤：失败则直接阻断CI ===
      - name: 抓取赔率并更新（必须成功）
        run: python update_odds_net.py --no-push
        env:
          PYTHONIOENCODING: utf-8

      # === 赛果步骤：网易主源（sports.163.com/caipiao/match/football/jczq）+ 体彩备用 ===
      # 网易jczq页按"完赛日期"分组，包含全部已完赛场次，CI不再受体彩API IP封锁影响
      # 仅当网易主源返回空时才降级到体彩（CI环境下体彩通常返回HTTP 567，作为最后兜底）
      - name: 抓取赛果（网易主源+体彩备用，失败重试）
        id: results_step
        uses: nick-fields/retry@v3
        continue-on-error: true
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_wait_seconds: 30
          shell: bash
          command: |
            set -euo pipefail
            echo "== 第${RETRY_ATTEMPT_NUMBER:-1}次尝试抓取赛果 =="
            python update_odds_net.py --no-push --results-only
        env:
          PYTHONIOENCODING: utf-8
      - name: 记录赛果状态
        if: always()
        run: |
          if [ "${{ steps.results_step.outcome }}" = "success" ]; then
            echo "RESULTS_OK=true" >> $GITHUB_ENV
            echo "✅ 赛果抓取成功"
          else
            echo "RESULTS_OK=false" >> $GITHUB_ENV
            echo "⚠️ 赛果抓取失败（网易主源+体彩备用均无数据），降级为仅推送赔率"
          fi

      # === 赛果校验：只在赛果抓取成功时才校验（失败时跳过，不阻断推送）===
      - name: 校验赛果完整性（仅在赛果成功时执行）
        if: env.RESULTS_OK == 'true'
        run: |
          set -euo pipefail
          python3 -c "
          import json, sys
          from datetime import date, timedelta
          with open('results_data.json', 'r', encoding='utf-8') as f:
              results = json.load(f)
          yesterday = (date.today() - timedelta(days=1)).strftime('%Y-%m-%d')
          yest_count = sum(1 for k in results if k.startswith(yesterday))
          print(f'昨日({yesterday})赛果: {yest_count} 条')
          from datetime import datetime
          h = datetime.utcnow().hour
          if h >= 4 and yest_count == 0:
              print(f'❌ 已过12点(北京时间)，{yesterday}赛果仍为0条，赛果同步异常')
              sys.exit(1)
          print('✅ 赛果校验通过')
          "

      - name: 生成版本号
        run: date '+%Y%m%d%H%M%S' > version.txt

      - name: 验证数据完整性（league 字段）
        run: |
          python3 -c "
          import json, sys
          with open('odds_data.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          games = data.get('data', {})
          if not games:
              print('⚠️ 无比赛数据，跳过验证')
              sys.exit(0)
          empty = sum(1 for g in games.values() if not g.get('league'))
          total = len(games)
          ratio = empty / total
          print(f'联赛字段检查: {empty}/{total} 为空 ({ratio:.0%})')
          if ratio > 0.8:
              print('❌ 超过 80% 的比赛 league 字段为空，终止发布')
              sys.exit(1)
          if ratio > 0.3:
              print(f'⚠️ {ratio:.0%} 的比赛 league 为空（不阻断，仅警告）')
          print('✅ 数据完整性校验通过')
          "

      - name: 检查是否有更新
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # === 推送：无论赛果成功还是降级，只要赔率有更新就推送 ===
      - name: 推送更新到 master 和 gh-pages
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # 保存更新文件到临时目录
          cp odds_data.json /tmp/odds_data.json
          cp index.html /tmp/index.html
          cp version.txt /tmp/version.txt
          rm -rf /tmp/odds_history
          cp -r odds_history/ /tmp/odds_history/ 2>/dev/null || true
          cp results_data.json /tmp/results_data.json
          rm -rf /tmp/results_history
          cp -r results_history/ /tmp/results_history/ 2>/dev/null || true

          # 1. 推送到 master
          git add index.html odds_data.json version.txt
          git add odds_history/ 2>/dev/null || true
          git add results_data.json 2>/dev/null || true
          git add results_history/ 2>/dev/null || true
          git diff --cached --stat
          STATUS_TAG="${{ env.RESULTS_OK == 'true' && '赔率+赛果' || '仅赔率(网易主源+体彩备用赛果均失败)' }}"
          git commit -m "data: 自动更新${STATUS_TAG} $(date '+%Y-%m-%d %H:%M')"
          git pull origin master --rebase
          git push origin master

          # 2. 推送到 gh-pages
          git checkout gh-pages
          cp /tmp/odds_data.json odds_data.json
          cp /tmp/index.html index.html
          cp /tmp/version.txt version.txt
          mkdir -p odds_history
          cp -r /tmp/odds_history/* odds_history/ 2>/dev/null || true
          cp /tmp/results_data.json results_data.json
          mkdir -p results_history
          cp -r /tmp/results_history/* results_history/ 2>/dev/null || true
          git add index.html odds_data.json version.txt
          git add odds_history/ 2>/dev/null || true
          git add results_data.json 2>/dev/null || true
          git add results_history/ 2>/dev/null || true
          git diff --cached --stat
          git commit -m "data: 自动更新${STATUS_TAG} $(date '+%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git pull origin gh-pages --rebase
          git push origin gh-pages

      # === 赛果失败时自动创建 GitHub Issue 通知管理员 ===
      - name: 创建赛果失败通知 Issue
        if: env.RESULTS_OK == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            // 检查是否已有同名 issue（避免重复创建）
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: '赛果同步失败'
            });
            const existing = issues.data.find(i => i.title.includes(today));
            if (existing) {
              console.log(`今日已创建过 issue #${existing.number}，跳过`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `赛果同步失败 ${today}（网易主源+体彩备用均失败）`,
              body: [
                '## 赛果抓取失败',
                '',
                `**时间**: ${today}`,
                `**根因**: 网易jczq赛果页 + 体彩赛果API 均未返回有效数据`,
                `**影响**: 赔率已正常推送，但赛果为空。需在本地手动补抓：`,
                '',
                '```bash',
                'python update_odds_net.py --results-only',
                '```',
                '',
                '**修复后**: 推送 master + gh-pages 即可',
                '',
                '> 此 Issue 由 CI 自动创建，补抓后可关闭。'
              ].join('\n'),
              labels: ['赛果同步失败', 'auto-created']
            });
